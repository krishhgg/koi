name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's runs share a group, so a new push cancels the superseded run.
# Every other run gets a group of its own: GitHub drops a pending run when a
# newer one queues in the same group, even without cancel-in-progress, so a
# shared group for main would skip pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    # Pinned, not ubuntu-latest: the box runs 24.04, and the SSH transport's
    # tests against a real sshd do not pass on 26.04's OpenSSH yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  infra:
    name: OpenTofu format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The koi module's wake.tf zips the built bundle, so validate needs it
      # to exist.
      - run: scripts/build-lambda.sh
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false -input=false
      - run: tofu -chdir=infra validate
